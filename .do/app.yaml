# DigitalOcean App Platform spec for FocusStack
# Repo: https://github.com/pranayranka45-art/focusstack-app-repo
name: focusstack
region: blr

databases:
  - name: db
    engine: PG
    version: "16"
    production: true

services:
  - name: api
    github:
      repo: pranayranka45-art/focusstack-app-repo
      branch: main
      deploy_on_push: true
    source_dir: backend
    dockerfile_path: Dockerfile
    http_port: 8000
    instance_count: 1
    instance_size_slug: basic-xxs
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}
      - key: CORS_ORIGINS
        scope: RUN_TIME
        value: ${web.PUBLIC_URL}

  - name: web
    github:
      repo: pranayranka45-art/focusstack-app-repo
      branch: main
      deploy_on_push: true
    source_dir: frontend
    dockerfile_path: Dockerfile
    http_port: 80
    instance_count: 1
    instance_size_slug: basic-xxs
    routes:
      - path: /
    envs:
      - key: API_UPSTREAM_HOST
        scope: RUN_TIME
        value: ${api.HOSTNAME}
      - key: API_UPSTREAM_PORT
        scope: RUN_TIME
        value: "8000"
