# DigitalOcean App Platform spec for FocusStack
# Repo: https://github.com/pranayranka45-art/focusstack-app-repo
name: focusstack
region: blr

databases:
  - name: db
    engine: PG
    version: "16"
    production: true

services:
  - name: api
    github:
      repo: pranayranka45-art/focusstack-app-repo
      branch: main
      deploy_on_push: true
    source_dir: backend
    dockerfile_path: Dockerfile
    http_port: 8000
    instance_count: 1
    instance_size_slug: basic-xs   # JDK + Node + Python need more than 512 MB
    health_check:
      http_path: /api/health
    # Route /api straight to the API service at the platform edge. No nginx
    # proxy hop, no Docker DNS (127.0.0.11) needed.
    routes:
      - path: /api
        preserve_path_prefix: true
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}
      - key: CORS_ORIGINS
        scope: RUN_TIME
        value: https://www.focusstack.tech,https://focusstack.tech

  - name: web
    github:
      repo: pranayranka45-art/focusstack-app-repo
      branch: main
      deploy_on_push: true
    source_dir: frontend
    dockerfile_path: Dockerfile
    http_port: 80
    instance_count: 1
    instance_size_slug: basic-xxs
    routes:
      - path: /
